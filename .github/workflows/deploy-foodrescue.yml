name: Deploy FoodRescue Website

on:
  push:
    branches: [main]
    paths:
      - 'FoodRescue/frontend/**'
      - '.github/workflows/deploy-foodrescue.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FoodRescue/frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install and build React
        working-directory: FoodRescue/frontend
        env:
          VITE_USE_MOCK_DATA: 'true'
          VITE_API_BASE_URL: 'http://localhost:8080'
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: FoodRescue/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
